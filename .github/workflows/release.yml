name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0)'
        required: true
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: 'all'

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
            TAG=${GITHUB_REF#refs/tags/}
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract changelog section for this version
          awk -v version="$VERSION" '
            /^## \[/ { in_section=0 }
            $0 ~ "\\[" version "\\]" { in_section=1; next }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog.md
          # Escape for JSON
          CHANGELOG=$(cat /tmp/changelog.md | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Update package.json Version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [ios, android]
        include:
          - platform: ios
            profile: production
          - platform: android
            profile: production
    if: ${{ needs.prepare.outputs.version != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure Build Credentials
        run: |
          # Credentials are configured via EAS dashboard
          # This step validates they exist
          eas credentials:configure --platform ${{ matrix.platform }} --non-interactive || true

      - name: Build ${{ matrix.platform }}
        run: |
          eas build --platform ${{ matrix.platform }} --profile ${{ matrix.profile }} --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            *.aab
            *.apk
            *.ipa
          retention-days: 30

  publish-web:
    name: Publish Web
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Deploy to Expo
        run: npx expo deploy --platform web
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  ota-update:
    name: Publish OTA Update
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA Update
        run: |
          eas update --branch production --message "Release v${{ needs.prepare.outputs.version }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [prepare, build, publish-web, ota-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: *-build
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          body: |
            ## CampusForge v${{ needs.prepare.outputs.version }}
            
            ${{ needs.prepare.outputs.changelog }}
            
            ### Downloads
            - **iOS**: [CampusForge.ipa](https://expo.dev/accounts/chetanDev06/projects/CampusForge/builds) (via EAS)
            - **Android**: [CampusForge.aab](https://expo.dev/accounts/chetanDev06/projects/CampusForge/builds) (via EAS)
            - **Web**: [Live Demo](https://campusforge.app)
            
            ### Installation
            - iOS: Install via TestFlight or App Store
            - Android: Install via Play Store or direct APK
            - Web: Visit the live demo link
          draft: false
          prerelease: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Completion
    needs: [prepare, build, publish-web, ota-update, create-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Notification
        run: |
          STATUS="${{ job.status }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Release v$VERSION completed successfully!"
            echo "📦 Builds: https://expo.dev/accounts/chetanDev06/projects/CampusForge/builds"
            echo "🌐 Web: https://campusforge.app"
            echo "📋 Release: https://github.com/ChetanDev06/CampusForge/releases/tag/v$VERSION"
          else
            echo "❌ Release v$VERSION failed!"
            echo "Check workflow: https://github.com/ChetanDev06/CampusForge/actions/runs/${{ github.run_id }}"
          fi
        # Add Slack/Discord webhook here if desired