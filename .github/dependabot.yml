version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo*"
        update-types:
          - "minor"
          - "patch"
      firebase:
        patterns:
          - "firebase*"
          - "@react-native-firebase*"
        update-types:
          - "minor"
          - "patch"
      react-native:
        patterns:
          - "react-native*"
          - "@react-navigation*"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        patterns:
          - "eslint*"
          - "typescript*"
          - "@types*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major version upgrades require manual review
      - dependency-type: "direct"
        update-type: "version-update:semver-major"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"